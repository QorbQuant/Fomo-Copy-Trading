<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>avgJOE Vault — Migrate v1 → v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         max-width: 560px; margin: 2.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; } .sub { color: #8b949e; font-size: .85rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.1rem; margin: 1rem 0; }
  .step { color: #58a6ff; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; justify-content: space-between; margin: .35rem 0; font-size: .95rem; }
  .row span:first-child { color: #8b949e; }
  button { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: .7rem 1.1rem;
           font-size: 1rem; cursor: pointer; margin-top: .7rem; width: 100%; }
  button:disabled { background: #30363d; color: #8b949e; cursor: default; }
  #status { font-size: .9rem; color: #d29922; margin-top: .8rem; min-height: 1.2em; word-break: break-all; }
</style>
</head>
<body>
<h1>avgJOE Vault — migrate v1 → v2</h1>
<p class="sub">v1 is liquidated to USDG. Redeem your v1 shares (you get clean USDG),
then deposit into v2 (multi-chain). Each button is one MetaMask popup; your key never leaves your wallet.</p>

<div class="card">
  <button id="connect">Connect MetaMask</button>
  <div class="row"><span>Account</span><span id="acct">—</span></div>
  <div class="row"><span>v1 shares</span><span id="v1shares">—</span></div>
  <div class="row"><span>Your USDG</span><span id="usdg">—</span></div>
  <div class="row"><span>v2 shares</span><span id="v2shares">—</span></div>
</div>

<div class="card">
  <div class="step">Step 1 — redeem v1</div>
  <button id="redeem" disabled>Redeem all v1 shares → USDG</button>
</div>
<div class="card">
  <div class="step">Step 2 — deposit into v2</div>
  <button id="approve" disabled>Approve USDG for v2</button>
  <button id="deposit" disabled>Deposit all USDG → v2</button>
</div>
<div id="status"></div>

<script>
const V1   = "0x12b508A1883b910a537c25883AE7DB518c1511D9";
const V2   = "0xd6A56e553174dE93B3d29d0042270e3FeA99AC0c";
const USDG = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168";
const CHAIN = "0x1237"; // 4663
const RPC = "https://rpc.mainnet.chain.robinhood.com";
let acct = null, v1bal = 0n, usdgBal = 0n;

const $ = id => document.getElementById(id);
const pad = h => h.replace(/^0x/, "").toLowerCase().padStart(64, "0");
const status = m => { $("status").textContent = m; };
const fmt = (raw, dec, dp) => (Number(BigInt(raw)) / 10 ** dec).toLocaleString(undefined, {maximumFractionDigits: dp});

async function ethCall(to, data) {
  return ethereum.request({method: "eth_call", params: [{to, data}, "latest"]});
}
async function refresh() {
  if (!acct) return;
  const me = pad(acct);
  v1bal = BigInt(await ethCall(V1, "0x70a08231" + me));   // balanceOf
  usdgBal = BigInt(await ethCall(USDG, "0x70a08231" + me));
  const v2bal = BigInt(await ethCall(V2, "0x70a08231" + me));
  $("v1shares").textContent = fmt(v1bal, 18, 4);
  $("usdg").textContent = "$" + fmt(usdgBal, 6, 2);
  $("v2shares").textContent = fmt(v2bal, 18, 4);
  $("redeem").disabled = v1bal === 0n;
  $("approve").disabled = usdgBal === 0n;
  $("deposit").disabled = usdgBal === 0n;
}
async function ensureChain() {
  try { await ethereum.request({method: "wallet_switchEthereumChain", params: [{chainId: CHAIN}]}); }
  catch (e) { if (e.code === 4902) await ethereum.request({method: "wallet_addEthereumChain", params: [{
    chainId: CHAIN, chainName: "Robinhood Chain", rpcUrls: [RPC],
    nativeCurrency: {name: "Ether", symbol: "ETH", decimals: 18},
    blockExplorerUrls: ["https://robinhoodchain.blockscout.com"]}]}); else throw e; }
}
async function send(to, data, label) {
  status(label + " — confirm in MetaMask…");
  const tx = await ethereum.request({method: "eth_sendTransaction", params: [{from: acct, to, data}]});
  status(label + " sent: " + tx + " — waiting…");
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const rec = await ethereum.request({method: "eth_getTransactionReceipt", params: [tx]});
    if (rec) { status(rec.status === "0x1" ? label + " confirmed ✓" : label + " REVERTED — tell Claude: " + tx);
      await refresh(); return rec.status === "0x1"; }
  }
  status(label + ": still pending — " + tx); return false;
}

$("connect").onclick = async () => {
  if (!window.ethereum) { status("MetaMask not detected."); return; }
  acct = (await ethereum.request({method: "eth_requestAccounts"}))[0];
  await ensureChain();
  $("acct").textContent = acct.slice(0, 6) + "…" + acct.slice(-4);
  status(""); await refresh();
};
$("redeem").onclick = async () => {
  // redeemInKind(uint256 shares, address receiver)
  await send(V1, "0x6aaf8653" + pad("0x" + v1bal.toString(16)) + pad(acct), "Redeem v1");
};
$("approve").onclick = async () => {
  await send(USDG, "0x095ea7b3" + pad(V2) + pad("0x" + usdgBal.toString(16)), "Approve USDG");
};
$("deposit").onclick = async () => {
  await send(V2, "0xb6b55f25" + pad("0x" + usdgBal.toString(16)), "Deposit v2");
};
</script>
</body>
</html>
